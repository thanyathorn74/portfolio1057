<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<title>Page Title</title>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
	<script src='register.js'></script>
</head>
<body>
	<form name="myRegister" id="myRegister" action="login.html">
		<fieldset>
			<h1><legend>Register</legend></h1>
			<h2><span>* require</span></h2>
			<span id="errormsg"></span>
			<h3>First name*: 
			<input type="text" name="firstname" required><br>
			<br>
			Last name*: 
			<input type="text" name="lastname" ><br>
			<br>
			Gender*: 
			<input type="radio" name="gender" value="male" >Male
			<input type="radio" name="gender" value="female" >Female
			<input type="radio" name="gender" value="female" >Other<br>
			<br>
			Birthday*: 
			<input type="date" name="bday" value="" ><br>
			<br>
			Email address*: 
			<input type="email" name="email" ><br>
			<br>
			Username*: 
			<input type="text" name="username" ><br>
			<br>
			Password*: 
			<input type="password" name="password" required><br>
			<br>
			Retype Password*: 
			<input type="password" name="password" required><br>
			</h3>
			<h4><input type="submit" value="Register">
			<input type="reset" value="Reset"></h4>
		</fieldset>
	</form>
</body>
</html>
